name: Android build

# Builds an installable test APK on GitHub's runners instead of EAS, so test
# builds cost nothing beyond Actions minutes. Every APK is opened on an
# Android 15 emulator first; only one that is still running 30 seconds after
# launch is published, as a GitHub Release named "Android build N". Open it on
# the phone and tap the .apk.
#
# Signed with the React Native template's shared debug key, so builds install
# over each other but are for testing only. Play Store uploads need the real
# upload key (already generated on EAS for @neutcrafts/steps).

on:
  push:
    branches: [master]
    # Docs and the smoke test don't change the app; don't spend a build on them.
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.github/scripts/**'
      - '.github/workflows/android-smoke.yml'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      # React Native 0.88 needs Node 22.13+; 24 ships npm 11, which wrote package-lock.json.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  build-apk:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      # android/ is generated from app.json and the config plugins, never committed.
      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      # 64-bit ARM only: every current phone runs it, and compiling native code
      # for all four CPU types took over 30 minutes on GitHub's runners.
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      # Only handed between jobs; the release keeps the APK, so don't spend
      # artifact storage keeping a second copy.
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 1

  # Android 15 matches the first test phone. x86_64 emulator images translate
  # ARM code, so the arm64 APK runs as-is.
  smoke-test:
    needs: build-apk
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash .github/scripts/launch-and-capture.sh app-release.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test
          path: smoke/
          retention-days: 7

  publish:
    needs: smoke-test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk

      - name: Publish the APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="steps-${{ github.run_number }}.apk"
          mv app-release.apk "$apk"
          gh release create "android-${{ github.run_number }}" "$apk" \
            --repo "${{ github.repository }}" \
            --title "Android build ${{ github.run_number }}" \
            --notes "Test build from ${GITHUB_SHA::7}, opened on an Android 15 emulator before publishing. Install on an Android phone; allow installs from this source when asked." \
            --prerelease \
            --target "$GITHUB_SHA"

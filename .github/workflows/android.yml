name: Android build

# Builds an installable test APK on GitHub's runners instead of EAS, so test
# builds cost nothing beyond Actions minutes. Every APK is opened on an
# Android 15 emulator first; only one that is still running 30 seconds after
# launch is published, as a GitHub Release named "Android build N". Open it on
# the phone and tap the .apk.
#
# Gradle signs the APK with the React Native template's debug key. That key
# ships in every React Native project, so anyone can sign an app with it:
# passkeys must never trust it. With the ANDROID_TEST_* secrets set (README,
# "Test signing key"), the APK is signed again with our own private test key.
# Play Store uploads use the upload key on EAS, never this one.

on:
  push:
    branches: [master]
    # Docs and the smoke test don't change the app; don't spend a build on them.
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.github/scripts/**'
      - '.github/workflows/android-smoke.yml'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      # React Native 0.88 needs Node 22.13+; 24 ships npm 11, which wrote package-lock.json.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  build-apk:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      # android/ is generated from app.json and the config plugins, never committed.
      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      # The step counter's timing rules (gaps, restarts, clock changes), on the JVM.
      - name: Step counter unit tests
        working-directory: android
        run: ./gradlew :step-counter:testDebugUnitTest --no-daemon

      # 64-bit ARM for phones, plus x86_64 for the emulator in the smoke test:
      # React Native's library loader only looks for the emulator's own CPU
      # type, so an ARM-only APK can't start there. Building all four CPU types
      # took over an hour on GitHub's runners.
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,x86_64

      # Passkeys trust an app only by its signing certificate, so test APKs
      # must carry a key only we hold. The keystore is written to the runner's
      # temp folder and deleted at the end; passwords reach apksigner through
      # the environment, never the command line.
      - name: Sign with the private test key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_TEST_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_TEST_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_TEST_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_TEST_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_TEST_KEYSTORE_BASE64 secret: this APK keeps React Native's public debug key, so passkey sign-in can't work on it."
            exit 0
          fi
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          keystore="$RUNNER_TEMP/test-key.jks"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          apk=android/app/build/outputs/apk/release/app-release.apk
          # Without --key-pass, apksigner uses the keystore password (PKCS12 keystores have only one).
          "$apksigner" sign --ks "$keystore" --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias "$KEY_ALIAS" \
            ${KEY_PASSWORD:+--key-pass env:KEY_PASSWORD} --out "$RUNNER_TEMP/signed.apk" "$apk"
          mv "$RUNNER_TEMP/signed.apk" "$apk"

      # Passkeys work only for an app whose signing certificate is listed in
      # https://<rpId>/.well-known/assetlinks.json, and the sign-in server only
      # accepts origin android:apk-key-hash:<the same SHA-256, base64url>. Both
      # forms go in the run summary: a certificate's fingerprint is public, so
      # this prints no secret. For the template's debug key it prints a warning
      # instead, so nobody copies that one into the server's settings.
      - name: Print the APK signing certificate
        run: |
          set -o pipefail
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          hex="$("$apksigner" verify --print-certs android/app/build/outputs/apk/release/app-release.apk \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          test -n "$hex"
          # React Native's template debug.keystore (password "android"), the same in every project.
          if [ "${hex,,}" = "fac61745dc0903786fb9ede62a962b399f7348f0bb6f899b8332667591033b9c" ]; then
            echo "::warning::Signed with React Native's public debug key. Never list it in assetlinks.json or the sign-in server's origins."
            echo "Signed with React Native's public debug key, so passkey sign-in can't work on this APK. Set the ANDROID_TEST_* secrets (README, \"Test signing key\")." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 - "$hex" <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import base64, sys
          digest = bytes.fromhex(sys.argv[1])
          print("assetlinks sha256_cert_fingerprints: " + ":".join(f"{b:02X}" for b in digest))
          print("")
          print("origin: android:apk-key-hash:" + base64.urlsafe_b64encode(digest).decode().rstrip("="))
          EOF

      # Only handed between jobs; the release keeps the APK, so don't spend
      # artifact storage keeping a second copy.
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 1

  # Android 15 matches the first test phone; the APK's x86_64 libraries run
  # natively on the emulator.
  smoke-test:
    needs: build-apk
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash .github/scripts/launch-and-capture.sh app-release.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test
          path: smoke/
          retention-days: 7

  publish:
    needs: smoke-test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk

      - name: Publish the APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="steps-${{ github.run_number }}.apk"
          mv app-release.apk "$apk"
          # Builds run by hand from another branch say so, so they aren't mistaken for master.
          title="Android build ${{ github.run_number }}"
          if [ "$GITHUB_REF_NAME" != "master" ]; then title="$title ($GITHUB_REF_NAME test)"; fi
          gh release create "android-${{ github.run_number }}" "$apk" \
            --repo "${{ github.repository }}" \
            --title "$title" \
            --notes "Test build from ${GITHUB_SHA::7}, opened on an Android 15 emulator before publishing. Install on an Android phone; allow installs from this source when asked." \
            --prerelease \
            --target "$GITHUB_SHA"

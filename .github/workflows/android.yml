name: Android build

# Builds an installable test APK on GitHub's runners instead of EAS, so test
# builds cost nothing beyond Actions minutes. Each build is attached to a
# GitHub Release named "Android build N": open it on the phone (signed in to
# GitHub) and tap the .apk.
#
# Signed with the React Native template's shared debug key, so builds install
# over each other but are for testing only. Play Store uploads need the real
# upload key (already generated on EAS for @neutcrafts/steps).

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      # React Native 0.88 needs Node 22.13+; 24 ships npm 11, which wrote package-lock.json.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  build-apk:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      # android/ is generated from app.json and the config plugins, never committed.
      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Publish the APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="steps-${{ github.run_number }}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk"
          gh release create "android-${{ github.run_number }}" "$apk" \
            --title "Android build ${{ github.run_number }}" \
            --notes "Test build from ${GITHUB_SHA::7}. Install on an Android phone; allow installs from this source when asked." \
            --prerelease \
            --target "$GITHUB_SHA"

      - uses: actions/upload-artifact@v4
        with:
          name: steps-${{ github.run_number }}-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14

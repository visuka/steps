plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.stepcounter'
version = '0.1.0'

android {
  namespace "expo.modules.stepcounter"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  implementation 'androidx.core:core-ktx:1.13.1'
  // Google's step recorder (Recording API on mobile), part of Google Play services.
  implementation 'com.google.android.gms:play-services-fitness:21.3.0'
  // Fused location and Activity Recognition for walks; expo-location already brings this version.
  implementation 'com.google.android.gms:play-services-location:21.0.1'
  testImplementation 'junit:junit:4.13.2'
}

plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.blockstore'
version = '0.1.0'

android {
  namespace "expo.modules.blockstore"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // Google's Block Store (part of Google Play services): a few small values
  // that stay through a reinstall and move to a new phone restored from the
  // Google backup.
  implementation 'com.google.android.gms:play-services-auth-blockstore:16.4.0'
}
